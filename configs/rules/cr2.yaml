rule_id: CR2
name: Weak or Unauthenticated Encryption Mode
category: WEAK_OR_UNAUTHENTICATED_ENCRYPTION
severity: HIGH
description: Detects Electronic Codebook (ECB) mode encryption which lacks confidentiality and patterns protection.
rule_version: 1.0.0

targeted_apis:
  - AES.new
  - Crypto.Cipher.AES.new
  - cryptography.hazmat.primitives.ciphers.modes.ECB
  - modes.ECB

remediation: Use an authenticated encryption mode such as AES-GCM or ChaCha20-Poly1305 which provides both confidentiality and data integrity authentication.
