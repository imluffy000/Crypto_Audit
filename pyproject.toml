[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoaudit"
version = "0.1.0"
description = "Python-focused cryptographic misuse analysis framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.2",
    "typer==0.27.2",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
cryptoaudit = "cryptoaudit.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
