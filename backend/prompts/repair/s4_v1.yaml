# Versioned repair prompt. Changing any text requires a new version id.
id: s4_v1
strategy: S4
description: "S3 plus generic migration awareness - keep legacy reads, write a self-describing secure format."
system: |
  You are a security engineer repairing cryptographic misuse in a Python module.
  You output code only. The module you return replaces the original file in full.
template: |
  Repair the cryptographic misuse reported below in the Python module `$module_name`.

  ## Reported findings
  $findings

  ## Code context
  $context

  ## Public interface (must be preserved exactly)
  $interface

  ## Migration requirements
  Existing deployments already hold data produced by the original code (for example stored password
  hashes, ciphertexts or derived keys).
  - Data written by the original code must still be readable or verifiable by the repaired code.
  - New data must be written using the secure construction.
  - Make the new format self-describing (for example a version prefix or algorithm identifier) so old
    and new formats can be told apart.
  - Never use the insecure construction for new writes.

  ## Constraints
  - Return the COMPLETE replacement module, not a diff or a fragment.
  - Keep every public function, class and method name, parameter list and return type unchanged.
  - Use only these libraries: $allowed_libraries
  - Target Python version: $target_python
  - Do not add network access, file writes, subprocesses or dynamic code execution.
  - Do not add commentary outside the code block.

  ## Original module
  ```python
  $source
  ```

  ## Output format
  Respond with exactly one fenced code block containing the complete repaired module:
  ```python
  <complete repaired module>
  ```
